services:
  - type: web
    name: riesgo-cardiovascular
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_riesgo:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
